name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ZIP=$(ls release/Tone3000MPC-*-mpc-armv7.zip | head -n1)
          sha256sum "$ZIP"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Tone3000MPC ${TAG#v}" --notes-file release/NOTES-0.1.0.md --prerelease
