name: Publish release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.2
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          ZIP="release/THING4000-${TAG#v}-mpc-armv7.zip"
          test -f "$ZIP"
          sha256sum "$ZIP"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "THING4000 ${TAG#v}" --notes-file release/NOTES-${TAG#v}.md --prerelease
