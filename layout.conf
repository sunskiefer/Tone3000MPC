# THING4000 for MPC OS -- page layout (mpc-vst-plugins layout.conf syntax: tools/shadow_skin.py, docs/SKIN_STUDIO.md).
# THE editable layout file: every control sits where this file says (cx/cy/r/w/h). Move a control by editing its line.
# Coordinates are Force Shadow pixels: the plugin area is x 0..1280, y 86..714.
# Look: Meta4MPCXXL's text standard (label_scale 1.7, white ink, large live text) and Davies-top-view knobs (tools/knob_art.py;
# the knob colour follows the control's Q-Link slot via its radius: r=58 red, 57 orange, 56 yellow, 55 green, 54 blue,
# 53 purple, 52 pink, 51 light grey, 50 white).
# One tab; every page is a mode panel shown while the `view` parameter is at it (0 Overview 1 Chain 2 Browse 3 In/Out 4 EQ
# 5 Tuner 6 Presets 7 Setup). Header: OVERVIEW and < > on every page but the overview. Q-Links follow the page.
scale_names=1
label_scale=1.7
theme_bg=0e0e0e
theme_panel=0e0e0e
theme_line=3a3a3a
theme_ink=ffffff
theme_ink_dim=ffffff
theme_ink_faint=ffffff
theme_accent=3a3a3a
theme_accent_hi=ffffff
theme_knob_face=1c1c1c
theme_knob_ring=3a3a3a
theme_knob_dot=ffffff
theme_bar=0e0e0e
theme_seg_active=ffffff
theme_seg_inactive=1c1c1c
theme_seg_active_tx=111111
theme_btn_text=ffffff
theme_tab_on=ffffff
theme_tab_on_tx=111111
theme_lcd=1c1c1c
theme_box=1c1c1c
theme_tile_on=ffffff
qlinks_track = ql1,ql2,ql3,ql4,ql5,ql6,ql7,ql8,ql9,ql10,ql11,ql12,ql13,ql14,ql15,ql16

[tab THING4000]
# ---- header (every page but the overview)
button cx=90 cy=124 w=150 h=56 label="" key=nav_zoom when=in_sec:1 get=cap_overview tsize=30 tweight=700
button cx=240 cy=124 w=90 h=56 label="" key=nav_prev when=in_sec:1 get=cap_prev tsize=30 tweight=700
button cx=350 cy=124 w=90 h=56 label="" key=nav_next when=in_sec:1 get=cap_next tsize=30 tweight=700

# ================================================================== OVERVIEW (view 0)
button cx=170 cy=236 w=290 h=110 label="CHAIN" key=go_chain when=view:0 tsize=40
button cx=490 cy=236 w=290 h=110 label="BROWSE" key=go_browse when=view:0 tsize=40
button cx=810 cy=236 w=290 h=110 label="IN / OUT" key=go_inout when=view:0 tsize=40
button cx=1130 cy=236 w=290 h=110 label="EQ" key=go_eq when=view:0 tsize=40
button cx=170 cy=400 w=290 h=110 label="TUNER" key=go_tuner when=view:0 tsize=40
button cx=490 cy=400 w=290 h=110 label="PRESETS" key=go_presets when=view:0 tsize=40
button cx=810 cy=400 w=290 h=110 label="SETUP" key=go_setup when=view:0 tsize=40
readout cx=170 cy=306 w=290 h=36 label="" key=tile_chain when=view:0 tsize=26 tweight=700
readout cx=490 cy=306 w=290 h=36 label="" key=tile_browse when=view:0 tsize=26 tweight=700
readout cx=810 cy=306 w=290 h=36 label="" key=tile_inout when=view:0 tsize=26 tweight=700
readout cx=1130 cy=306 w=290 h=36 label="" key=tile_eq when=view:0 tsize=26 tweight=700
